[project]
name = "mlx-qwen3-tts-longform"
version = "0.1.0"
description = "Long-form narration with Qwen3-TTS on Apple Silicon (MLX): one consistent cloned voice, natural joins, about realtime"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    # pinned: qwen3_longform/qwen_fast.py patches mlx-audio's Qwen3-TTS decode internals
    "mlx-audio==0.6.4",
    "mlx-whisper>=0.4.3",
    "numpy",
    "scipy",
    "soundfile",
    "librosa",
    "pyloudnorm",
    "speechbrain>=1.1.2",
    "num2words>=0.5.14",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
qwen3-longform = "qwen3_longform.narrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen3_longform"]
